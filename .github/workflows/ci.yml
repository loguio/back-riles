name: CI

on:
  push:
    branches: [main, master]
  pull_request:

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Generate Prisma client
        run: npx prisma generate
      - name: Type check
        run: npm run type-check
      - name: Lint
        run: npm run lint
      - name: Unit tests
        run: npm test
      - name: Integration suites (mocked)
        run: npm run test:integration
        env:
          NODE_ENV: test
      - name: Apply database migrations (deploy)
        run: |
          if [ -z "${DATABASE_URL}" ] || [ -z "${DIRECT_URL}" ]; then
            echo "DATABASE_URL/DIRECT_URL not configured; skipping 'prisma migrate deploy'."
            exit 0
          fi
          npx prisma migrate deploy
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
          DIRECT_URL: ${{ secrets.DIRECT_URL }}

      - name: Build
        run: npm run build
